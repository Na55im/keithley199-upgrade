      </svg>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: #A9B5AF">

    <section aria-label="Aufnahme" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E5E0; padding: 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #FDE7DC; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #D9480F"></span></span>

  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rnd = (i) => { const x = Math.sin(i * 12.9898 + 9.1) * 43758.5453; return x - Math.floor(x); };
    let spark = '';
    for (let i = 0; i < 70; i++) { spark += (i ? 'L' : 'M') + (i * 320 / 69).toFixed(1) + ' ' + (32 - Math.sin(i / 6) * 13 - (rnd(i) - 0.5) * 14).toFixed(1); }
    return { spark };
  }
}
</script>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keithley 199</title>
<style>
:root {
  --bg: #f3f1ec; --card: #ffffff; --ink: #1d1f23; --dim: #6b7078; --line: #dcd8cf;
  --accent: #b5471f; --accent-ink: #ffffff; --ok: #2e7d4f; --bad: #b3261e;
  --plot: #b5471f; --plot2: #2f6f9f; --grid: #e6e2d9; --btn: #ece9e2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --card: #1e2125; --ink: #ecebe7; --dim: #9096a0; --line: #33373d;
    --accent: #f08a4b; --accent-ink: #1a1206; --ok: #6fcf97; --bad: #f2867f;
    --plot: #f08a4b; --plot2: #6fb3e0; --grid: #2a2e33; --btn: #2a2e33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px 6px; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
#conn { color: var(--dim); font-size: 13px; }
#conn b { font-weight: 600; }
#conn.on b { color: var(--ok); } #conn.off b { color: var(--bad); }
main { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; gap: 14px; padding: 8px 20px 24px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; }
#reading { font: 600 clamp(34px, 6vw, 52px)/1.1 "SF Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
#reading .unit { font-size: .5em; color: var(--dim); margin-left: .25em; }
#reading.stale { color: var(--dim); }
#ann { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; min-height: 22px; }
#ann span { font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
#ann span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#sub { color: var(--dim); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.row:last-child { margin-bottom: 0; }
.row label { width: 74px; color: var(--dim); font-size: 12px; flex: none; }
button, select { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: .45; cursor: default; }
canvas { width: 100%; display: block; }
#chart { height: 300px; } #hist { height: 120px; }
.chart-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.chart-head h2 { margin: 0; flex: 1; }
#stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; }
#stats div { min-width: 0; }
#stats small { display: block; color: var(--dim); font-size: 11px; }
#stats b { font: 600 14px "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
#console { font: 12px/1.45 "SF Mono", Menlo, monospace; height: 130px; overflow-y: auto; white-space: pre-wrap;
  background: var(--bg); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
#console .tx { color: var(--plot2); } #console .err { color: var(--bad); }
#cmdline { display: flex; gap: 6px; }
#cmdline input { flex: 1; font: 13px "SF Mono", Menlo, monospace; padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--card); color: var(--ink); min-width: 0; }
#hover { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 17px; }
</style>
</head>
<body>
<header>
  <h1>Keithley 199</h1>
  <span id="conn" class="off"><b>nicht verbunden</b></span>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2 id="funcname">Messwert</h2>
      <div id="reading" class="stale">–</div>
      <div id="ann"></div>
      <div id="sub"></div>
    </div>
    <div class="card" id="controls">
      <h2>Bedienung</h2>
      <div class="row"><label>Funktion</label><span id="funcs"></span></div>
      <div class="row"><label>Bereich</label><span id="ranges"></span></div>
      <div class="row"><label>Stellen</label><span id="digits"></span></div>
      <div class="row"><label>Optionen</label>
        <button data-toggle="filter" data-cmd="FILT">Filter</button>
        <button data-toggle="zero" data-cmd="ZERO">Zero</button>
        <button data-toggle="db" data-cmd="DB">dB</button>
      </div>
      <div class="row"><label>Trigger</label>
        <button id="trigcont" data-send="TRIG CONT">Dauernd</button>
        <button id="trigone" data-send="TRIG ONE">Einzeln</button>
        <button id="trg" data-send="*TRG">Auslösen</button>
      </div>
      <div class="row"><label>Scanner</label><select id="chan"></select>
        <button data-send="*RST" style="margin-left:auto">Reset</button>
      </div>
    </div>
    <div class="card">
      <h2>Befehle</h2>
      <div id="console"></div>
      <form id="cmdline"><input id="cmd" placeholder="z. B. *IDN? oder FUNC DCA" autocomplete="off" spellcheck="false">
        <button>Senden</button></form>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <div class="chart-head">
        <h2>Verlauf</h2>
        <select id="series"><option value="2">Anzeige (gefiltert)</option><option value="3">Rohwerte</option></select>
        <select id="window"><option value="60">1 min</option><option value="300" selected>5 min</option>
          <option value="1800">30 min</option><option value="7200">2 h</option><option value="0">alles</option></select>
        <button id="pause">Pause</button>
        <button id="clear">Leeren</button>
      </div>
      <canvas id="chart"></canvas>
      <div id="hover"></div>
    </div>
    <div class="card">
      <h2>Statistik im Fenster</h2>
      <div id="stats"></div>
    </div>
    <div class="card">
      <h2>Verteilung</h2>
      <canvas id="hist"></canvas>
    </div>
    <div class="card">
      <h2>Daten</h2>
      <div class="row">
        <button id="csv">CSV herunterladen</button>
        <button id="logbtn">Aufzeichnung in Datei</button>
        <span id="logname" style="color:var(--dim);font-size:12px"></span>
      </div>
    </div>
  </div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const FUNCS = [['DCV', 'DC V'], ['ACV', 'AC V'], ['DCA', 'DC A'], ['ACA', 'AC A'], ['OHM2', 'Ω 2-Leiter'], ['OHM4', 'Ω 4-Leiter']];
const FUNC_LONG = { DCV: 'Gleichspannung', ACV: 'Wechselspannung', DCA: 'Gleichstrom', ACA: 'Wechselstrom',
  OHM2: 'Widerstand, 2-Leiter', OHM4: 'Widerstand, 4-Leiter' };
let st = null, ranges = [], connected = false, paused = false;
let data = [];            // [wall_s, device_ms, value, raw, func, ri, flags]
let last = null, lastAt = 0;

/* ---- formatting ---------------------------------------------------------- */
function baseUnit(func) { return func.endsWith('V') ? 'V' : func.endsWith('A') ? 'A' : 'Ω'; }
/* scale, prefix and number of decimals for a range (same rule as the 199 display) */
function rangeFmt(func, fs, digits) {
  let scale = 1, prefix = '';
  if (func.startsWith('OHM')) { if (fs >= 1e6) { scale = 1e-6; prefix = 'M'; } else if (fs >= 1e3) { scale = 1e-3; prefix = 'k'; } }
  else if (fs < 1) { scale = 1e3; prefix = 'm'; }
  const intdig = Math.floor(Math.log10(fs * scale) + 1e-9) + 1;
  return { scale, unit: prefix + baseUnit(func), dec: Math.max(0, digits + 1 - intdig) };
}
function fmtVal(v, extraDec = 0) {
  if (!st || v === null || !isFinite(v)) return '–';
  const f = rangeFmt(st.func, st.fs, st.digits);
  return (v * f.scale).toFixed(Math.min(9, f.dec + extraDec)) + ' ' + f.unit;
}
function fmtSpan(v) {       /* small differences: pick a readable prefix */
  if (!st || !isFinite(v)) return '–';
  const u = baseUnit(st.func), a = Math.abs(v);
  const steps = [[1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n']];
  for (const [m, p] of steps) if (a >= m) return (v / m).toPrecision(4) + ' ' + p + u;
  return a === 0 ? '0 ' + u : (v / 1e-9).toPrecision(3) + ' n' + u;
}

/* ---- device link --------------------------------------------------------- */
function send(cmd) {
  return fetch('/cmd', { method: 'POST', body: cmd }).then(r => { if (!r.ok) logLine('nicht verbunden', 'err'); });
}
function logLine(text, cls) {
  const c = $('console'), d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  c.appendChild(d);
  while (c.childNodes.length > 200) c.removeChild(c.firstChild);
  c.scrollTop = c.scrollHeight;
}
function onMsg(m) {
  if (m.t === 'r') {
    if (st && m.r[4] !== (data.length ? data[data.length - 1][4] : m.r[4])) data = [];
    last = m.r; lastAt = Date.now();
    if (!(m.r[6] & 16)) data.push(m.r);
    if (data.length > 200000) data.splice(0, 20000);
    showReading();
  } else if (m.t === 's') {
    const funcChanged = st && st.func !== m.state.func;
    st = m.state;
    if (funcChanged) { data = []; last = null; }
    showState(); showReading();
  } else if (m.t === 'conn') {
    connected = m.connected; ranges = m.ranges || [];
    if (m.state && m.state.func) st = m.state;
    const c = $('conn');
    c.className = connected ? 'on' : 'off';
    c.innerHTML = connected ? '<b>verbunden</b> · ' : '<b>nicht verbunden</b> · Suche nach dem Gerät …';
    if (connected) c.append(m.port + (m.idn ? ' · ' + m.idn.split(',').slice(1).join(' ') : ''));
    $('logbtn').classList.toggle('on', !!m.log);
    $('logname').textContent = m.log || '';
    showState(); showReading();
  } else if (m.t === 'log') {
    if (m.dir === 'tx') logLine('> ' + m.line, 'tx');
    else logLine(m.line, m.line.startsWith('ERR') ? 'err' : '');
  }
}

/* ---- reading + state ----------------------------------------------------- */
function showReading() {
  const el = $('reading');
  if (!st || !last) { el.textContent = '–'; el.className = 'stale'; $('sub').textContent = ''; return; }
  el.className = '';
  const fl = last[6];
  if (fl & 16) { el.textContent = (last[2] < 0 ? '−' : '') + 'OVERFLOW'; $('sub').textContent = ''; return; }
  let num, unit;
  if (fl & 32) {
    const ref = st.func === 'ACA' ? 1e-3 : 1;
    num = Math.abs(last[2]) < 1e-12 ? '−∞' : (20 * Math.log10(Math.abs(last[2]) / ref)).toFixed(3);
    unit = st.func === 'ACA' ? 'dB (1 mA)' : 'dBV';
  } else {
    const f = rangeFmt(st.func, st.fs, st.digits);
    const x = last[2] * f.scale;
    num = (x < 0 ? '−' : st.func.startsWith('DC') ? '+' : '') + Math.abs(x).toFixed(f.dec);
    unit = f.unit;
  }
  el.innerHTML = '';
  el.append(num);
  const u = document.createElement('span'); u.className = 'unit'; u.textContent = unit; el.append(u);
  let sub = 'Rohwert ' + fmtVal(last[3], 1);
  if (st.zero) sub += ' · Zero-Bezug ' + fmtVal(st.zero_val);
  if (st.filter && !(fl & 8)) sub += ' · Filter füllt sich';
  $('sub').textContent = sub;
}
function showState() {
  const dis = !connected || !st;
  document.querySelectorAll('#controls button, #controls select').forEach(b => b.disabled = dis);
  if (!st) return;
  $('funcname').textContent = FUNC_LONG[st.func] || st.func;
  document.querySelectorAll('#funcs button').forEach(b => b.classList.toggle('on', b.dataset.f === st.func));
  const rg = $('ranges'); rg.innerHTML = '';
  const auto = document.createElement('button');
  auto.textContent = 'Auto'; auto.className = st.auto ? 'on' : ''; auto.onclick = () => send('RANG AUTO');
  rg.append(auto, ' ');
  ranges.forEach((fs, i) => {
    const b = document.createElement('button'), f = rangeFmt(st.func, fs, 0);
    const nominal = Math.pow(10, Math.floor(Math.log10(fs * f.scale) + 1e-9)) * 3;
    b.textContent = nominal + ' ' + f.unit;
    if (i === st.ri) b.className = 'on';
    b.onclick = () => send('RANG ' + i);
    rg.append(b, ' ');
  });
  document.querySelectorAll('#digits button').forEach(b => b.classList.toggle('on', +b.dataset.d === st.digits));
  document.querySelectorAll('[data-toggle]').forEach(b => b.classList.toggle('on', !!st[b.dataset.toggle]));
  document.querySelector('[data-toggle=db]').disabled = dis || !st.func.startsWith('AC');
  $('trigcont').classList.toggle('on', st.trig === 'CONT');
  $('trigone').classList.toggle('on', st.trig === 'ONE');
  $('trg').disabled = dis || st.trig !== 'ONE';
  $('chan').value = st.chan;
  const ann = $('ann'); ann.innerHTML = '';
  [['AUTO', st.auto], ['FILTER', st.filter], ['ZERO', st.zero], ['dB', st.db], ['EINZEL', st.trig === 'ONE'],
   ['KANAL ' + st.chan, st.chan > 0]].forEach(([t, on]) => {
    const s = document.createElement('span'); s.textContent = t; if (on) s.className = 'on'; ann.append(s);
  });
}

/* ---- chart, statistics, histogram ---------------------------------------- */
let view = [], hoverX = null, frozen = null;
function visible() {
  const src = paused && frozen ? frozen : data;
  const w = +$('window').value;
  if (!w || !src.length) return src;
  const t0 = src[src.length - 1][0] - w;
  let lo = 0, hi = src.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (src[m][0] < t0) lo = m + 1; else hi = m; }
  return src.slice(lo);
}
function setup(c) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * d) || c.height !== Math.round(r.height * d)) {
    c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
  }
  const g = c.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function niceStep(span, n) {
  const raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}
function draw() {
  const k = +$('series').value;
  view = visible();
  const [g, W, H] = setup($('chart'));
  const L = 86, R = 10, T = 8, B = 22;
  g.font = '11px -apple-system, sans-serif';
  if (view.length < 2) {
    g.fillStyle = css('--dim'); g.textAlign = 'center';
    g.fillText(connected ? 'Warte auf Messwerte …' : 'Keine Verbindung zum Gerät', W / 2, H / 2);
    drawStats([]); drawHist([]); return;
  }
  const t0 = view[0][0], t1 = view[view.length - 1][0];
  let lo = Infinity, hi = -Infinity;
  for (const r of view) { if (r[k] < lo) lo = r[k]; if (r[k] > hi) hi = r[k]; }
  let span = hi - lo;
  if (span <= 0) span = Math.abs(hi) * 1e-6 || 1e-9;
  lo -= span * 0.08; hi += span * 0.08; span = hi - lo;
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R);
  const Y = v => T + (hi - v) / span * (H - T - B);
  /* grid + y labels */
  g.strokeStyle = css('--grid'); g.fillStyle = css('--dim'); g.lineWidth = 1; g.textAlign = 'right'; g.textBaseline = 'middle';
  const ys = niceStep(span, 5), f = rangeFmt(st.func, st.fs, st.digits);
  const dec = Math.min(9, Math.max(0, Math.ceil(-Math.log10(ys * f.scale) + 1e-9)));
  for (let v = Math.ceil(lo / ys) * ys; v <= hi; v += ys) {
    g.beginPath(); g.moveTo(L, Y(v) + .5); g.lineTo(W - R, Y(v) + .5); g.stroke();
    g.fillText((v * f.scale).toFixed(dec) + ' ' + f.unit, L - 6, Y(v));
  }
  /* x labels */
  g.textAlign = 'center'; g.textBaseline = 'top';
  const xs = niceStep(t1 - t0, 6);
  for (let t = Math.ceil(t0 / xs) * xs; t <= t1; t += xs) {
    const d = new Date(t * 1000);
    g.fillText(d.toLocaleTimeString('de-DE', xs < 60 ? {} : { hour: '2-digit', minute: '2-digit' }), X(t), H - B + 5);
  }
  /* line, min/max per pixel column */
  g.strokeStyle = css(k === 3 ? '--plot2' : '--plot'); g.lineWidth = 1.5; g.lineJoin = 'round';
  g.beginPath();
  let px = -1, mn = 0, mx = 0, first = true;
  for (const r of view) {
    const x = Math.round(X(r[0]));
    if (x !== px) {
      if (px >= 0) { g.lineTo(px, Y(mn)); if (mx !== mn) g.lineTo(px, Y(mx)); }
      px = x; mn = mx = r[k];
      if (first) { g.moveTo(x, Y(r[k])); first = false; }
    } else { if (r[k] < mn) mn = r[k]; if (r[k] > mx) mx = r[k]; }
  }
  g.lineTo(px, Y(mn)); if (mx !== mn) g.lineTo(px, Y(mx));
  g.stroke();
  /* hover */
  if (hoverX !== null && hoverX >= L && hoverX <= W - R) {
    const t = t0 + (hoverX - L) / (W - L - R) * (t1 - t0);
    let i = 0, j = view.length - 1;
    while (i < j) { const m = (i + j) >> 1; if (view[m][0] < t) i = m + 1; else j = m; }
    if (i > 0 && t - view[i - 1][0] < view[i][0] - t) i--;
    const r = view[i];
    g.strokeStyle = css('--dim'); g.lineWidth = 1;
    g.beginPath(); g.moveTo(X(r[0]) + .5, T); g.lineTo(X(r[0]) + .5, H - B); g.stroke();
    g.fillStyle = css(k === 3 ? '--plot2' : '--plot');
    g.beginPath(); g.arc(X(r[0]), Y(r[k]), 3.5, 0, 7); g.fill();
    $('hover').textContent = new Date(r[0] * 1000).toLocaleTimeString('de-DE') + '  ·  ' + fmtVal(r[k], 1);
  } else $('hover').textContent = '';
  const vals = view.map(r => r[k]);
  drawStats(vals); drawHist(vals);
}
function drawStats(v) {
  const el = $('stats'); el.innerHTML = '';
  const add = (name, text) => { const d = document.createElement('div');
    d.innerHTML = '<small></small><b></b>'; d.firstChild.textContent = name; d.lastChild.textContent = text; el.append(d); };
  if (!v.length) { add('Anzahl', '0'); return; }
  let mn = Infinity, mx = -Infinity, s = 0;
  for (const x of v) { if (x < mn) mn = x; if (x > mx) mx = x; s += x; }
  const mean = s / v.length;
  let q = 0; for (const x of v) q += (x - mean) * (x - mean);
  const sd = v.length > 1 ? Math.sqrt(q / (v.length - 1)) : 0;
  add('Mittelwert', fmtVal(mean, 1)); add('Minimum', fmtVal(mn, 1)); add('Maximum', fmtVal(mx, 1));
  add('Spitze-Spitze', fmtSpan(mx - mn)); add('Standardabw.', fmtSpan(sd));
  add('Streuung', mean ? (Math.abs(sd / mean) * 1e6).toPrecision(3) + ' ppm' : '–');
  add('Anzahl', String(v.length));
}
function drawHist(v) {
  const [g, W, H] = setup($('hist'));
  if (v.length < 5) return;
  let mn = Infinity, mx = -Infinity;
  for (const x of v) { if (x < mn) mn = x; if (x > mx) mx = x; }
  if (mx <= mn) return;
  const N = Math.min(50, Math.max(10, Math.round(Math.sqrt(v.length)))), bins = new Array(N).fill(0);
  for (const x of v) bins[Math.min(N - 1, Math.floor((x - mn) / (mx - mn) * N))]++;
  const top = Math.max(...bins), B = 18, bw = W / N;
  g.fillStyle = css(+$('series').value === 3 ? '--plot2' : '--plot');
  bins.forEach((b, i) => { const h = b / top * (H - B - 4); g.fillRect(i * bw + 1, H - B - h, Math.max(1, bw - 2), h); });
  g.fillStyle = css('--dim'); g.font = '11px -apple-system, sans-serif'; g.textBaseline = 'bottom';
  g.textAlign = 'left'; g.fillText(fmtVal(mn, 1), 0, H);
  g.textAlign = 'right'; g.fillText(fmtVal(mx, 1), W, H);
}

/* ---- wiring -------------------------------------------------------------- */
FUNCS.forEach(([f, label]) => { const b = document.createElement('button');
  b.textContent = label; b.dataset.f = f; b.onclick = () => send('FUNC ' + f); $('funcs').append(b, ' '); });
[[4, '4½'], [5, '5½'], [6, '6½']].forEach(([d, label]) => { const b = document.createElement('button');
  b.textContent = label; b.dataset.d = d; b.onclick = () => send('DIG ' + d); $('digits').append(b, ' '); });
for (let i = 0; i <= 8; i++) $('chan').add(new Option(i ? 'Kanal ' + i : 'kein Kanal', i));
$('chan').onchange = e => send('CHAN ' + e.target.value);
document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => send(b.dataset.cmd + ' ' + (st[b.dataset.toggle] ? 0 : 1)));
document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => send(b.dataset.send));
$('cmdline').onsubmit = e => { e.preventDefault(); const v = $('cmd').value.trim(); if (v) send(v); $('cmd').value = ''; };
$('pause').onclick = () => { paused = !paused; frozen = paused ? data.slice() : null;
  $('pause').classList.toggle('on', paused); $('pause').textContent = paused ? 'Weiter' : 'Pause'; };
$('clear').onclick = () => { data = []; frozen = null; fetch('/clear', { method: 'POST' }); };
$('csv').onclick = () => { location.href = '/csv'; };
$('logbtn').onclick = () => fetch('/log', { method: 'POST', body: $('logbtn').classList.contains('on') ? '0' : '1' });
$('chart').onmousemove = e => { hoverX = e.offsetX; };
$('chart').onmouseleave = () => { hoverX = null; };

fetch('/history').then(r => r.json()).then(h => {
  onMsg(h.info);
  const f = st && st.func;
  data = h.readings.filter(r => !(r[6] & 16) && (!f || r[4] === f));
  if (h.readings.length) { last = h.readings[h.readings.length - 1]; lastAt = Date.now(); }
  showReading();
  const es = new EventSource('/events');
  es.onmessage = e => onMsg(JSON.parse(e.data));
  es.onerror = () => { connected = false; $('conn').className = 'off';
    $('conn').innerHTML = '<b>Programm nicht erreichbar</b> · k199_app.py läuft nicht'; showState(); };
});
setInterval(() => {
  if (last && Date.now() - lastAt > 5000) $('reading').className = 'stale';
  draw();
}, 250);
showState();
</script>
